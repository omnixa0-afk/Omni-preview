name: release

# Builds Omni.exe from the tagged commit on a GitHub-hosted runner and publishes a signed build
# provenance attestation for it, so anyone can check which commit and which workflow run produced
# the exe:
#
#   gh attestation verify Omni.exe -R <owner>/<repo>
#
# Everything is built here from source: libwebrtc (pinned in scripts/bootstrap-libwebrtc.ps1), the
# native media module, the Rust core and the WinUI shell. A tag v* ends in a DRAFT release with
# Omni.exe and SHA256SUMS.txt; a maintainer reviews and publishes it. A manual run only uploads the
# exe as a workflow artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    # libwebrtc from scratch dominates: checkout ~10 GB, build 1-2 h on a hosted runner.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      # SQLCipher's vendored OpenSSL needs Perl (Strawberry: Git's Perl lacks modules) and NASM.
      - name: Strawberry Perl first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'

      - uses: ilammy/setup-nasm@v1

      # libwebrtc and the release target take tens of GB: build on whichever drive has the most room
      # (the system drive of a hosted runner is the tight one).
      - name: Pick the build drive
        shell: pwsh
        run: |
          # Letters only: pwsh also lists Temp:, an alias of a folder on the system drive.
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -match '^[A-Z]$' -and $_.Free -gt 0 }
          $drives | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
          $best = $drives | Sort-Object Free -Descending | Select-Object -First 1
          "OMNI_BUILD_ROOT=$($best.Name):\omni-build" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "building on $($best.Name): ($([int]($best.Free/1GB)) GB free)"

      - name: libwebrtc sources (pinned revision)
        shell: pwsh
        run: .\scripts\bootstrap-libwebrtc.ps1 -DependencyRoot "$env:OMNI_BUILD_ROOT\deps" -Sync -RunHooks

      - name: libwebrtc build
        shell: pwsh
        run: .\scripts\build-libwebrtc.ps1 -DependencyRoot "$env:OMNI_BUILD_ROOT\deps"

      - name: Native media module
        shell: pwsh
        run: .\scripts\build-omni-webrtc-media.ps1 -Configuration Release -UseLibWebRtc -NoTest -WebRtcSrc "$env:OMNI_BUILD_ROOT\deps\webrtc\src"

      - name: Release exe
        shell: pwsh
        run: .\scripts\release.ps1 -TargetDir "$env:OMNI_BUILD_ROOT\release-target"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Omni.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Omni-${{ github.sha }}
          path: |
            dist/Omni.exe
            dist/SHA256SUMS.txt

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Built by this repository's release workflow from $env:GITHUB_SHA.`n`nVerify the download:`n`n    gh attestation verify Omni.exe -R $env:GITHUB_REPOSITORY`n`nSHA-256 is in SHA256SUMS.txt."
          gh release create $env:GITHUB_REF_NAME dist/Omni.exe dist/SHA256SUMS.txt --draft --prerelease --title $env:GITHUB_REF_NAME --notes $notes
